name: CI/CD Pipeline

on:
  push:
    branches: [ develop, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ develop ]

permissions:
  contents: read
  packages: write

jobs:
  # 1. Dev Workflow (On PR or Push to develop)
  build-test:
    uses: ./.github/workflows/reusable-build.yaml
    with:
      environment: dev
      image_tag: ${{ github.sha }}
    secrets:
      REGISTRY_USERNAME: ${{ github.actor }}
      REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

  deploy-dev:
    needs: build-test
    if: github.ref == 'refs/heads/develop'
    uses: ./.github/workflows/reusable-deploy.yaml
    with:
      environment: dev
      image_tag: ${{ github.sha }}
    secrets:
      KUBECONFIG: ${{ secrets.KUBECONFIG_DEV }}

  # 2. Staging Workflow (Release branches - simulated here via tag logic or specific branch)
  deploy-staging:
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/reusable-deploy.yaml
    with:
      environment: staging
      image_tag: ${{ github.sha }}
    secrets:
      KUBECONFIG: ${{ secrets.KUBECONFIG_STAGING }}

  # 3. Production Workflow (Tags with Manual Approval)
  deploy-prod:
    needs: deploy-staging
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/reusable-deploy.yaml
    with:
      environment: production # Requires 'production' env in GitHub Settings with Reviewers
      image_tag: ${{ github.sha }}
    secrets:
      KUBECONFIG: ${{ secrets.KUBECONFIG_PROD }}
